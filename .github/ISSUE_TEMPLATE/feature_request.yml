name: Feature request
description: Suggest an improvement or optional module.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should Sunder solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include examples, settings and how this fits the existing interface.
    validations:
      required: true
