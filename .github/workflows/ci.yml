name: Check and package Sunder
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/sunder.py test
      - run: python tools/sunder.py package
      - uses: actions/upload-artifact@v4
        with:
          name: Sunder-release
          path: |
            dist/*.zip
            dist/*.json
